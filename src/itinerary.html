<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Journey's Uncharted</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="scripts/itinerary.ts"></script>
  </head>
  <body>
    <header>
      <nav id="navbar">
        <a href="index.html" class="site-brand">
          <img class="logo" src="/resources/images/icon.png?v=2" alt="Journey's Uncharted Logo">
          <span>Journey's Uncharted</span>
        </a>

        <div class="header_links">
          <a href="/destinations.html" class="link inactive">Destinations</a>
          <a href="/itinerary.html" class="link active">Itinerary</a>
          <a href="/wishlist.html" class="link inactive">Wishlist</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="itinerary_body">
        <div id="itinerary_type_filter_container">
          <label for="itinerary_type_filter">Type</label>
          <select id="itinerary_type_filter">
            <option>All types</option>
          </select>
        </div>
        <div id="itinerary_events">
          <div class="itinerary_item">
            <div class="itinerary_item_header">
                    <span class="itinerary_item_title"><b>Your itinerary is here!</b></span>
                    <span class="itinerary_item_type"></span>
                </div>
                <div class="itinerary_item_body">
                    <span class="itinerary_item_notes">You can add places and events to your itinerary from their respective page</span>
                </div>
                <div class="itinerary_item_footer">
                    <span class="itinerary_item_location"></span>
                    <span class="itinerary_item_date"></span>
                </div>
          </div>
        </div>
        <div id="add_custom_itinerary_event">
          +
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
